[workspace]
resolver = "3"
members = [
    "crates/aristide-model",
    "crates/aristide-formats",
    "crates/aristide-engine",
    "crates/aristide-server",
    "crates/aristide-console",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/macaque/aristide"
authors = ["Alex Pylypenko"]

[workspace.dependencies]
aristide-model = { path = "crates/aristide-model" }
aristide-formats = { path = "crates/aristide-formats" }
aristide-engine = { path = "crates/aristide-engine" }
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = "0.3"
serde = { version = "1", features = ["derive"] }
# Test-only: the state snapshot is hand-written JSON, and nothing else
# would catch a field landing inside the wrong object.
serde_json = "1"
toml = "0.9"

[profile.release]
lto = "thin"
codegen-units = 1

[profile.dev.package."*"]
opt-level = 2
