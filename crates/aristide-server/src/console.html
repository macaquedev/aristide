<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aristide</title>
<style>
  :root { color-scheme: dark; }
  body { font-family: system-ui, sans-serif; background: #14161a; color: #e8e6e3;
         margin: 0 auto; max-width: 640px; padding: 1.2rem; }
  h1 { font-size: 1.1rem; letter-spacing: 0.15em; text-transform: uppercase;
       color: #c8a24a; margin: 0 0 1rem; }
  h2 { font-size: 0.8rem; letter-spacing: 0.1em; text-transform: uppercase;
       color: #8b93a1; margin: 1.2rem 0 0.4rem; border-bottom: 1px solid #2a2e35;
       padding-bottom: 0.3rem; }
  .stops { display: flex; flex-wrap: wrap; gap: 0.4rem; }
  button.stop { border: 1px solid #3a3f48; border-radius: 999px;
       background: #1d2025; color: #b9bec7; padding: 0.45rem 0.9rem; font-size: 0.85rem;
       cursor: pointer; }
  button.stop.on { background: #c8a24a; border-color: #c8a24a; color: #14161a;
       font-weight: 600; }
  .row { display: flex; align-items: center; gap: 0.8rem; margin-top: 1.2rem; }
  input[type=range] { flex: 1; accent-color: #c8a24a; }
  #trem.on { background: #7fb069; border-color: #7fb069; color: #14161a; }
</style>
</head>
<body>
<h1>Aristide — registration</h1>
<div id="noorgan" style="display:none">
  <p id="loadphase" style="color:#8b93a1;font-size:0.85rem"></p>
  <p id="loaderror" style="color:#e5484d;font-size:0.85rem"></p>
  <div id="library" class="stops"></div>
</div>
<div id="manuals"></div>
<div class="row" id="tuningrow" style="display:none">
  <label style="color:#8b93a1;font-size:0.8rem">TUNING</label>
  <select id="temperament">
    <option>equal</option><option>werckmeister3</option>
    <option>kirnberger3</option><option>meantone4</option>
    <option>pythagorean</option>
  </select>
  <label for="refkey" style="color:#8b93a1;font-size:0.8rem">REFERENCE</label>
  <input id="refkey" type="text" style="width:3.5rem">
  <span style="color:#8b93a1">=</span>
  <input id="refhz" type="number" step="0.1" style="width:5rem">
  <label for="transpose" style="color:#8b93a1;font-size:0.8rem">TRANSPOSE</label>
  <input id="transpose" type="number" min="-12" max="12" step="1" style="width:3.5rem">
</div>
<div class="row" id="mainrow">
  <button id="cancel" class="stop">General cancel</button>
  <button id="trem" class="stop">Tremulant</button>
  <label for="gain" style="color:#8b93a1;font-size:0.8rem">GAIN</label>
  <input id="gain" type="range" min="0.05" max="1.2" step="0.05">
  <span id="gainv" style="color:#8b93a1;font-size:0.8rem;width:2.5rem"></span>
  <label for="reverb" style="color:#8b93a1;font-size:0.8rem;display:none" id="reverblbl">REVERB</label>
  <input id="reverb" type="range" min="0" max="1" step="0.05" style="display:none">
</div>
<div class="row" id="noiserow" style="display:none">
  <button id="noisetoggle" class="stop">Stop noises</button>
  <label for="noisevol" style="color:#8b93a1;font-size:0.8rem">NOISE VOL</label>
  <input id="noisevol" type="range" min="0" max="1.5" step="0.05">
</div>
<script>
// A remote for an instrument, not a web page: the browser's own
// context menu (Stop, Reload…) stays out of the way — except on
// fields that take text, where the menu is how paste happens.
window.addEventListener('contextmenu', (event) => {
  if (event.target.closest('textarea, input[type=text], input[type=number], input:not([type])')) return;
  event.preventDefault();
});

// MIDI note number spelled in scientific pitch notation (middle C = C4) —
// the fallback UI has no modules, so this mirrors the console's own
// js/pitch.js keyName() in miniature, ASCII accidentals only.
const NOTE_NAMES = ['C', 'C#', 'D', 'Eb', 'E', 'F', 'F#', 'G', 'Ab', 'A', 'Bb', 'B'];
function keyName(key) {
  return `${NOTE_NAMES[key % 12]}${Math.floor(key / 12) - 1}`;
}

async function refresh(data) {
  if (!data) data = await (await fetch('/api/state')).json();

  // No organ loaded yet (or still loading): the stoplist has nothing to
  // show, so show the library instead — pick one, and the usual refresh
  // loop takes over once it lands.
  document.getElementById('noorgan').style.display = data.organ ? 'none' : '';
  for (const id of ['manuals', 'mainrow']) {
    document.getElementById(id).style.display = data.organ ? '' : 'none';
  }
  if (!data.organ) {
    const phase = document.getElementById('loadphase');
    phase.textContent = data.loading || '';
    phase.style.display = data.loading ? '' : 'none';
    const err = document.getElementById('loaderror');
    err.textContent = data.load_error || '';
    err.style.display = data.load_error ? '' : 'none';
    const lib = document.getElementById('library');
    lib.innerHTML = '';
    for (const entry of data.library || []) {
      const b = document.createElement('button');
      b.className = 'stop';
      b.textContent = entry.name;
      b.title = entry.path;
      b.onclick = async () => refresh(await (await fetch(
        `/api/organ/load?path=${encodeURIComponent(entry.path)}`, {method: 'POST'})).json());
      lib.appendChild(b);
    }
    // The page has no poll loop; while there is no organ, keep looking
    // so a finished load replaces this list with the console.
    clearTimeout(refresh.poll);
    refresh.poll = setTimeout(() => refresh(), 1000);
    return;
  }

  const groups = {};
  for (const s of data.stops) (groups[s.manual] ||= []).push(s);
  const root = document.getElementById('manuals');
  root.innerHTML = '';
  for (const [manual, stops] of Object.entries(groups)) {
    const h = document.createElement('h2');
    h.textContent = manual;
    root.appendChild(h);
    const div = document.createElement('div');
    div.className = 'stops';
    for (const s of stops) {
      const b = document.createElement('button');
      b.className = 'stop' + (s.on ? ' on' : '');
      b.textContent = s.name;
      b.onclick = async () => refresh(await (await fetch(
        `/api/stop?id=${s.id}&on=${s.on ? 0 : 1}`, {method: 'POST'})).json());
      div.appendChild(b);
    }
    root.appendChild(div);
  }
  if ((data.enclosures || []).length) {
    const h = document.createElement('h2');
    h.textContent = 'Swell';
    root.appendChild(h);
    for (const e of data.enclosures) {
      const row = document.createElement('div');
      row.className = 'row';
      const label = document.createElement('label');
      label.textContent = e.name;
      label.style.cssText = 'color:#8b93a1;font-size:0.8rem;min-width:6rem';
      const slider = document.createElement('input');
      slider.type = 'range';
      slider.min = 0; slider.max = 1; slider.step = 0.01;
      slider.value = e.value;
      const pct = document.createElement('span');
      pct.style.cssText = 'color:#8b93a1;font-size:0.8rem;width:3rem';
      pct.textContent = Math.round(e.value * 100) + '%';
      slider.oninput = () => pct.textContent = Math.round(slider.value * 100) + '%';
      slider.onchange = async () => refresh(await (await fetch(
        `/api/enclosure?idx=${e.idx}&v=${slider.value}`, {method: 'POST'})).json());
      row.append(label, slider, pct);
      root.appendChild(row);
    }
  }
  if (data.couplers.length) {
    const h = document.createElement('h2');
    h.textContent = 'Couplers';
    root.appendChild(h);
    const div = document.createElement('div');
    div.className = 'stops';
    for (const c of data.couplers) {
      const b = document.createElement('button');
      b.className = 'stop' + (c.on ? ' on' : '');
      b.textContent = c.name;
      b.onclick = async () => refresh(await (await fetch(
        `/api/coupler?idx=${c.idx}&on=${c.on ? 0 : 1}`, {method: 'POST'})).json());
      div.appendChild(b);
    }
    root.appendChild(div);
  }
  document.getElementById('cancel').onclick = async () => refresh(await (await fetch(
    '/api/cancel', {method: 'POST'})).json());
  const trem = document.getElementById('trem');
  trem.classList.toggle('on', data.tremulant);
  trem.onclick = async () => refresh(await (await fetch(
    `/api/trem?on=${data.tremulant ? 0 : 1}`, {method: 'POST'})).json());
  if (data.tuning) {
    const row = document.getElementById('tuningrow');
    row.style.display = 'flex';
    const temperament = document.getElementById('temperament');
    const refkey = document.getElementById('refkey');
    const refhz = document.getElementById('refhz');
    const transpose = document.getElementById('transpose');
    if (document.activeElement !== temperament) temperament.value = data.tuning.temperament;
    if (document.activeElement !== refkey) refkey.value = keyName(data.tuning.reference.key);
    if (document.activeElement !== refhz) refhz.value = data.tuning.reference.hz;
    if (document.activeElement !== transpose) transpose.value = data.tuning.transpose;
    const post = async () => refresh(await (await fetch(
      `/api/tuning?temperament=${temperament.value}` +
      `&reference_key=${encodeURIComponent(refkey.value)}&reference_hz=${refhz.value}` +
      `&transpose=${transpose.value}`,
      {method: 'POST'})).json());
    temperament.onchange = post; refkey.onchange = post; refhz.onchange = post; transpose.onchange = post;
  }
  const gain = document.getElementById('gain');
  gain.value = data.gain;
  document.getElementById('gainv').textContent = Number(data.gain).toFixed(2);
  gain.oninput = () => document.getElementById('gainv').textContent =
    Number(gain.value).toFixed(2);
  gain.onchange = async () => refresh(await (await fetch(
    `/api/gain?v=${gain.value}`, {method: 'POST'})).json());
  if (data.noises) {
    document.getElementById('noiserow').style.display = 'flex';
    const toggle = document.getElementById('noisetoggle');
    const vol = document.getElementById('noisevol');
    toggle.classList.toggle('on', data.noises.on);
    if (document.activeElement !== vol) vol.value = data.noises.vol;
    toggle.onclick = async () => refresh(await (await fetch(
      `/api/noises?on=${data.noises.on ? 0 : 1}&vol=${vol.value}`, {method: 'POST'})).json());
    vol.onchange = async () => refresh(await (await fetch(
      `/api/noises?on=${data.noises.on ? 1 : 0}&vol=${vol.value}`, {method: 'POST'})).json());
  }
  if (data.reverb !== undefined) {
    const reverb = document.getElementById('reverb');
    document.getElementById('reverblbl').style.display = '';
    reverb.style.display = '';
    if (document.activeElement !== reverb) reverb.value = data.reverb;
    reverb.onchange = async () => refresh(await (await fetch(
      `/api/reverb?wet=${reverb.value}`, {method: 'POST'})).json());
  }
}
refresh();
</script>
</body>
</html>
