<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Aristide</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="offline" class="offline hidden">no connection to the organ</div>
  <header id="rail" class="rail">
    <div class="nameplate"><span id="organ-name">Aristide</span></div>
    <div class="rail-controls">
      <label class="slider-group" id="gain-group">
        <span class="rail-label">VOLUME</span>
        <input id="gain" type="range" min="0" max="1" step="0.01" />
      </label>
      <label class="slider-group hidden" id="reverb-group">
        <span class="rail-label">REVERB</span>
        <input id="reverb" type="range" min="0" max="1" step="0.01" />
      </label>
      <button class="keys-button" id="keys" data-tip="Play with the computer keyboard"
        aria-label="Computer keyboard mapping">KEYS</button>
      <button class="tuning" id="tuning" data-tip="Tuning &amp; console settings"
        aria-label="Tuning &amp; console settings"></button>
      <button id="panic" class="panic" data-tip="Silence everything">PANIC</button>
    </div>
  </header>
  <aside id="settings" class="settings hidden">
    <label class="settings-row" id="temperament-row">
      <span class="rail-label">TEMPERAMENT</span>
      <select id="set-temperament">
        <option value="equal">Equal</option>
        <option value="werckmeister3">Werckmeister III</option>
        <option value="kirnberger3">Kirnberger III</option>
        <option value="meantone4">Meantone &frac14;-comma</option>
        <option value="pythagorean">Pythagorean</option>
      </select>
    </label>
    <label class="settings-row" id="pitch-row">
      <span class="rail-label">PITCH a&prime;</span>
      <span class="stepper"><input id="set-a4" type="number" min="300" max="500" step="0.5" /> Hz</span>
    </label>
    <div class="settings-row" id="transpose-row">
      <span class="rail-label">TRANSPOSE</span>
      <span class="stepper">
        <button id="transpose-down">&minus;</button>
        <span id="transpose-value">0</span>
        <button id="transpose-up">+</button>
      </span>
    </div>
    <div class="settings-row" id="noises-row">
      <span class="rail-label">NOISES</span>
      <span class="stepper">
        <input id="noises-on" type="checkbox" aria-label="Blower and action noises" />
        <input id="noises-vol" type="range" min="0" max="1" step="0.01" />
      </span>
    </div>
  </aside>
  <aside id="keys-legend" class="keys-legend hidden" aria-label="Computer keyboard mapping"></aside>
  <main id="console" class="console">
    <section id="jamb-left" class="jamb"></section>
    <section class="center">
      <div id="couplers" class="coupler-rail"></div>
      <div id="manuals" class="manuals"></div>
      <div id="pedals" class="pedals"></div>
    </section>
    <section id="jamb-right" class="jamb"></section>
  </main>
  <script type="module" src="js/main.js"></script>
</body>
</html>
