# Aristide sidecar for the GrandOrgue demo set.
# Lives next to the set, never modifies it.

[midi]
# Channel 0 plays the Great; pedal moves to channel 2.
channels = ["First Manual", "Second Manual", "Pedal"]

[registration]
# Empty = cancelled: the organ starts with no stop drawn. "*" draws
# every stop; a plein jeu would be
# ["Bourdon 16'", "Montre 8'", "Prestant 4'", "Plein jeu III"]
default = []

[wind]
# Steady full-chorus pitch sag in cents (0 = off); transient dips go a
# touch deeper. bounce_hz/damping shape the regulator's spring-back.
sag_cents = 3.0
bounce_hz = 3.5
damping = 0.5

[tuning]
# equal | werckmeister3 | kirnberger3 | meantone4 | pythagorean
temperament = "equal"
a4_hz = 440.0
transpose = 0

# Convolution reverb (this set is recorded wet, so off by default):
# [reverb]
# ir = "synthetic"        # or a path to an IR wav next to the set
# wet = 0.2

# The set's own [Tremulant001] ("Tremblant", 196 ms ≈ 5.1 Hz on the
# Récit chest) is read from the ODF and needs nothing here. Writing a
# [tremulant] section replaces the set's tremulants with this single
# instrument-wide one:
# [tremulant]
# rate_hz = 4.6           # typical range 4-7 Hz; lower = calmer
# depth_cents = 12.0
# chests = [3]            # 1-based ODF windchest numbers; empty = all

[enclosures]
# Swell boxes (the set defines two: Recit on chest 3, an undisplayed
# "Grandorgue" box on chest 2). Constants per
# docs/research/enclosure-modeling.md — tune by ear:
#   floor_db   broadband attenuation fully closed (0 = use the set's
#              AmpMinimumLevel: Recit 20% = -14 dB, GO box 30% = -10.5 dB)
#   shelf_db   extra treble attenuation fully closed (the "muffle")
#   corner_*   where the muffle hinges, open -> closed
#   taper      1 = dB-linear pedal law (Hauptwerk); >1 bunches near closed
#   full_sweep_s  shutter inertia (0 = pedal drives shutters directly)
cc = 11
floor_db = 0.0
shelf_db = -10.0
corner_open_hz = 8000.0
corner_closed_hz = 1000.0
taper = 1.0
full_sweep_s = 0.5
